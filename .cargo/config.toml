[unstable]
build-std = ["core", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]

[alias]
gen-bindings = [
  "run",
  "-Zbuild-std=",
  "-Zbuild-std-features=",
  "-p",
  "gen-bindings",
]

[target.'cfg(target_family = "rust9x")']
linker = "rust-lld"
rustflags = ["-C", "link-args=/NODEFAULTLIB"]
