cargo-features = ["panic-immediate-abort"]

[workspace]
members = ["gen-bindings"]

[package]
name = "r9xrsrt"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]
name = "libcmt"

[features]
default = ["windows_raw_dylib"]

windows_raw_dylib = []
# fallback mem functions, only needed without `-Zbuild-std-features=compiler-builtins-mem`
# these are minimal and slow, prefer using compiler-builtins-mem.
mem = []

[dependencies]
windows-sys = { version = "0.61.2", default-features = false }

[profile.dev]
opt-level = 1
panic = "immediate-abort"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "immediate-abort"
